name: Build Windows Setup

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install PyQt5 PyQtChart pymongo dnspython requests openpyxl pyinstaller
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
    
    - name: Inject connection settings
      shell: bash
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
      run: |
        python - <<'PY'
        import json, os
        uri = os.environ.get("MONGO_URI", "").strip()
        if not uri:
            print("UYARI: MONGO_URI secret tanimli degil — example config kullanilacak")
            exit(0)
        cfg = json.load(open("config.json.example", encoding="utf-8"))
        cfg["mongo_uri"] = uri
        with open("config.json.example", "w", encoding="utf-8") as fh:
            json.dump(cfg, fh, indent=2, ensure_ascii=False)
        PY
    
    - name: Build Merkez EXE
      run: .\build_center.bat
    
    - name: Build Kasa EXE
      run: .\build_pos.bat
    
    - name: Build Setup files
      run: .\build_setup.bat
    
    - name: Upload Setup artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GivorPartners-Setup-v1.0.0
        path: installer/Output/*.exe
        retention-days: 30
