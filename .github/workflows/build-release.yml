name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller pymongo PyQt5 Pillow

      - name: Update version
        shell: python
        run: |
          import re
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          with open("version.py", "r+", encoding="utf-8") as f:
              content = re.sub(r'VERSION = ".*?"', f'VERSION = "{version}"', f.read())
              f.seek(0); f.write(content); f.truncate()

      - name: Build merkez
        run: pyinstaller yazarkasa-merkez.spec

      - name: Build kasa
        run: pyinstaller yazarkasa-kasa.spec

      - name: Create version.json
        shell: python
        run: |
          import json
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          repo = "${{ github.repository }}"
          base = f"https://github.com/{repo}/releases/download/{tag}"
          data = {
              "version": version,
              "download_url_windows_merkez": f"{base}/yazarkasa-merkez.exe",
              "download_url_windows_kasa": f"{base}/yazarkasa-kasa.exe",
              "download_url_linux": f"{base}/givorpartners-kasa-v{version}.AppImage",
              "changelog": "Yeni surum"
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yazarkasa-merkez.exe
            dist/yazarkasa-kasa.exe
            version.json

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-xinerama0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python deps
        run: pip install pyinstaller pymongo PyQt5 Pillow

      - name: Update version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" version.py

      - name: Build merkez
        run: pyinstaller yazarkasa-merkez.spec

      - name: Build kasa
        run: pyinstaller yazarkasa-kasa.spec

      - name: Package tar.gz
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          mkdir -p linux-out
          cp dist/yazarkasa-merkez dist/yazarkasa-kasa config.json linux-out/
          tar -czf "givorpartners-linux-v${VERSION}.tar.gz" -C linux-out .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yazarkasa-merkez
            dist/yazarkasa-kasa
            givorpartners-linux-v*.tar.gz
