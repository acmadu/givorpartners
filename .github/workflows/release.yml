name: Release Windows Setup

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install PyQt5 PyQtChart pymongo dnspython requests openpyxl pyinstaller
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
    
    - name: Inject connection settings
      shell: bash
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
      run: |
        python - <<'PY'
        import json, os
        uri = os.environ.get("MONGO_URI", "").strip()
        if not uri:
            print("UYARI: MONGO_URI secret tanimli degil — example config kullanilacak")
            exit(0)
        cfg = json.load(open("config.json.example", encoding="utf-8"))
        cfg["mongo_uri"] = uri
        with open("config.json.example", "w", encoding="utf-8") as fh:
            json.dump(cfg, fh, indent=2, ensure_ascii=False)
        print("config.json.example guncellendi")
        PY
    
    - name: Build Merkez EXE
      run: .\build_center.bat
    
    - name: Build Kasa EXE
      run: .\build_pos.bat
    
    - name: Build Setup files
      run: .\build_setup.bat
    
    - name: Generate version.json
      shell: bash
      run: |
        TAG="${{ github.ref_name }}"
        VER="${TAG#v}"
        cat > version.json <<EOF
        {
          "version": "$VER",
          "yazarkasa-merkez_setup_url": "https://github.com/acmadu/givorpartners/releases/download/$TAG/yazarkasa-merkez-setup-v1.0.0.exe",
          "yazarkasa-kasa_setup_url": "https://github.com/acmadu/givorpartners/releases/download/$TAG/yazarkasa-kasa-setup-v1.0.0.exe"
        }
        EOF
        cat version.json
    
    - name: Create Release and Upload Files
      shell: bash
      run: |
        gh release create "${{ github.ref_name }}" \
          installer/Output/yazarkasa-merkez-setup-v1.0.0.exe \
          installer/Output/yazarkasa-kasa-setup-v1.0.0.exe \
          version.json \
          --title "GivorPartners ${{ github.ref_name }}" \
          --generate-notes \
        || gh release upload "${{ github.ref_name }}" \
          installer/Output/yazarkasa-merkez-setup-v1.0.0.exe \
          installer/Output/yazarkasa-kasa-setup-v1.0.0.exe \
          version.json --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
