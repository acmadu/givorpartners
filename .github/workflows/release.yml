name: Release Windows Setup

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install PyQt5 PyQtChart pymongo openpyxl pyinstaller
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
    
    - name: Build Merkez EXE
      run: .\build_center.bat
    
    - name: Build Kasa EXE
      run: .\build_pos.bat
    
    - name: Build Setup files
      run: .\build_setup.bat
    
    - name: Create Release and Upload Files
      run: |
        gh release create ${{ github.ref_name }} \
          installer/Output/yazarkasa-merkez-setup-v1.0.0.exe \
          installer/Output/yazarkasa-kasa-setup-v1.0.0.exe \
          --title "GivorPartners ${{ github.ref_name }}" \
          --generate-notes || gh release upload ${{ github.ref_name }} \
          installer/Output/yazarkasa-merkez-setup-v1.0.0.exe \
          installer/Output/yazarkasa-kasa-setup-v1.0.0.exe
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
